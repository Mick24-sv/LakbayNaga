# Apply only after all release tickets are merged into main.
services:
  - type: web
    name: lakbaynaga-api
    runtime: node
    branch: main
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci --omit=dev --workspace backend --include-workspace-root=false
    startCommand: npm start --workspace backend
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
